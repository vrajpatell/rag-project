services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./examples:/app/examples
    environment:
      - APP_ENV=local
      - AUTH_MODE=none
      - METADATA_STORE=sqlite
      - SQLITE_PATH=./data/metadata.db
